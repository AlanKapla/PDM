services:
  webapi:
    container_name: pdm-webapi-development
    build:
      context: ../02-ApplicationServices/ProductDataManagementWebAPI
      dockerfile: ../../03-Deployment/Backend/API/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    env_file:
      - ./.env.development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    expose:
      - "8080"
    networks:
      - pdm-net

  ui:
    container_name: pdm-ui-development
    build:
      context: ../01-Applications/ProjectDataManagementUI
      dockerfile: ../../03-Deployment/Frontend/UI/Dockerfile
    expose:
      - "80"
    networks:
      - pdm-net

  gateway:
    image: nginx:1.27-alpine
    container_name: pdm-gateway-development
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapi
      - ui
    ports:
      - "8085:80"           # <-- tu wisi reverse proxy na hoście
    restart: always
    networks:
      - pdm-net

networks:
  pdm-net:
    name: pdm-net-development

volumes:
  dpkeys: {}
