x-common-env: &common-env
  # możesz to nadpisać w .env lub w GitHub Environment (ASPNETCORE_ENVIRONMENT)
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ASPNETCORE_URLS: http://+:8080
  DOTNET_EnableDiagnostics: "0"
  ASPNETCORE_THREADPOOL_MINTHREADS: "20"

services:
  webapi:
    # WAŻNE: workflow robi docker exec "pdm-webapi-$envName"
    # a w .env tworzysz: ENVIRONMENT=$envName (dev/ppd/prd)
    container_name: "pdm-webapi-${ENVIRONMENT}"

    image: "pdm-webapi:${TAG:-latest}"
    build:
      context: ../02-ApplicationServices/ProductDataManagementWebAPI
      dockerfile: ../../03-Deployment/Backend/API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release

    # plik tworzony w workflowu (Create .env for docker-compose)
    env_file:
      - ./.env

    environment:
      <<: *common-env

    expose:
      - "8080"

    restart: unless-stopped

    healthcheck:
      # workflow robi: docker exec ... curl -sf http://localhost:8080/api/health
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp

    volumes:
      # klucze dla DataProtection (PersistKeysToFileSystem("/keys"))
      - pdm-keys:/keys

    labels:
      com.pdm.service: "webapi"
      com.pdm.env: "${ENVIRONMENT}"

    networks:
      - pdm-net


  ui:
    container_name: "pdm-ui-${ENVIRONMENT}"

    image: "pdm-ui:${TAG:-latest}"
    build:
      context: ../01-Applications/ProjectDataManagementUI
      dockerfile: ../../03-Deployment/Frontend/UI/Dockerfile

    env_file:
      - ./.env

    # UI jest dostępne tylko w sieci Dockera, nginx do niego proxuje
    expose:
      - "80"

    restart: unless-stopped

    labels:
      com.pdm.service: "ui"
      com.pdm.env: "${ENVIRONMENT}"

    networks:
      - pdm-net


  nginx:
    container_name: "pdm-nginx-${ENVIRONMENT}"

    image: nginx:1.27-alpine

    depends_on:
      - webapi
      - ui

    # jeśli chcesz jakieś zmienne dla nginx, możesz dodać env_file lub environment
    volumes:
      # główny config reverse proxy
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    # Host-port dostarczany z GitHub Environment → vars.HOST_PORT
    # i zapisany do .env jako HOST_PORT=$hostPort
    ports:
      - "${HOST_PORT:-8085}:80"

    restart: unless-stopped

    labels:
      com.pdm.service: "gateway"
      com.pdm.env: "${ENVIRONMENT}"

    networks:
      - pdm-net


networks:
  pdm-net:
    # nazwa będzie np. pdm-net-dev / pdm-net-ppd / pdm-net-prd
    name: "pdm-net-${ENVIRONMENT}"

volumes:
  pdm-keys:
    # nazwa wolumenu też zależna od środowiska
    name: "pdm-keys-${ENVIRONMENT}"
