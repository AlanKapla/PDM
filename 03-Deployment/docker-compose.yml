x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  DOTNET_EnableDiagnostics: "0"
  ASPNETCORE_THREADPOOL_MINTHREADS: "20"

services:
  webapi:
    # unikalna nazwa kontenera per środowisko
    # dev  -> pdm-webapi-dev
    # ppd  -> pdm-webapi-ppd
    # prd  -> pdm-webapi-prd
    container_name: "pdm-webapi-${ENVIRONMENT}"

    image: "pdm-webapi:${TAG:-latest}"
    build:
      context: ../02-ApplicationServices/ProductDataManagementWebAPI
      dockerfile: ../../03-Deployment/Backend/API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release

    # .env generowany w GitHub Actions – zawiera m.in.:
    # ENVIRONMENT, HOST_PORT, AZURE_*, CONNECTIONSTRINGS__DEFAULTCONNECTION
    env_file:
      - ./.env

    environment:
      <<: *common-env

    # port hosta zależny od środowiska:
    # dev -> 8080, ppd -> 8081, prd -> 8082 (z .env → HOST_PORT)
    ports:
      - "${HOST_PORT:-8080}:8080"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp

    labels:
      com.pdm.service: "webapi"
      com.pdm.env: "${ENVIRONMENT:-dev}"

    networks:
      - pdm-net

networks:
  pdm-net:
    # osobna sieć per środowisko (np. pdm-net-dev, pdm-net-ppd, pdm-net-prd)
    name: "pdm-net-${ENVIRONMENT}"
