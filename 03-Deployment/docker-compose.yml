version: "3.9"

services:
  webapi:
    container_name: pdm-webapi
    image: pdm-webapi:${TAG:-latest}
    build:
      context: ../02-ApplicationServices/ProductDataManagementWebAPI
      dockerfile: ../../03-Deployment/Backend/API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_EnableDiagnostics: 0
      ASPNETCORE_THREADPOOL_MINTHREADS: 20
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    labels:
      com.pdm.service: "webapi"
      com.pdm.env: "production"     