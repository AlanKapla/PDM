services:
  webapi:
    container_name: pdm-webapi
    image: pdm-webapi:${TAG:-latest}
    build:
      context: ../02-ApplicationServices/ProductDataManagementWebAPI
      dockerfile: ../../03-Deployment/Backend/API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    env_file:
      - ./.env   # tylko na serwerze, generowany z GitHub Secrets / ręcznie
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_EnableDiagnostics: "0"
      ASPNETCORE_THREADPOOL_MINTHREADS: "20"
    ports:
      - "8080:8080"
    volumes:
      - dpkeys:/keys
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    labels:
      com.pdm.service: "webapi"
      com.pdm.env: "production"
    volumes:
      dpkeys:  
