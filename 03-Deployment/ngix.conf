server {
    listen 80;
    server_name _;

    # ============= UI =============
    # React SPA — index.html dla routingu client-side
    location / {
        # serwujemy UI z kontenera "ui"
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        try_files $uri /index.html;
    }

    # ============= API =============
    # WebAPI zwraca endpointy pod /api/*
    location /api/ {
        proxy_pass http://webapi:8080/;   # WebAPI działa w kontenerze na 8080
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============= WebSocket support (opcjonalnie) =============
    location /ws/ {
        proxy_pass http://webapi:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}