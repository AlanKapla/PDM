# WebSocket upgrade mapping - musi być przed blokiem server
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Limit rozmiaru body dla upload plików - 50 MB
    client_max_body_size 50M;
    
    # Timeouty dla upload dużych plików (5 minut)
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ============ Swagger (.NET) ============
    location /swagger {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ SignalR Hubs (WebSocket) ============
    location /api/hubs/ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Długie timeouty dla WebSocket (3600s = 1h)
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        
        # Wyłącz buffering dla real-time komunikacji
        proxy_buffering off;
    }

    # ============ API (.NET) ============
    location /api/ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Przekazanie informacji o oryginalnym rozmiarze body
        proxy_set_header Content-Length $content_length;
    }

    # ============ UI (React) ============
    location / {
        proxy_pass http://ui:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
