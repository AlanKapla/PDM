server {
    listen 80;
    server_name _;

    # Limit rozmiaru body dla upload plików - 50 MB
    client_max_body_size 50M;
    
    # Timeouty dla upload dużych plików (5 minut)
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ============ Swagger (.NET) ============
    location /swagger {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ API (.NET) ============
    location /api/ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Przekazanie informacji o oryginalnym rozmiarze body
        proxy_set_header Content-Length $content_length;
    }

    # ============ SignalR WebSocket ============
    location /api/hubs/ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;
        
        # WebSocket headers - REQUIRED for SignalR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep-alive dla długotrwałych połączeń WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============ UI (React) ============
    location / {
        proxy_pass http://ui:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
