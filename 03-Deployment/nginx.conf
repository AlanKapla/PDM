upstream ui {
    server ui:80;
}

upstream api {
    server webapi:8080;
}

server {
    listen 80;
    server_name _;

    # ============ UI (React) ============
    location / {
        proxy_pass http://ui;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ API (.NET) ============
    # /api/health  ->  /health
    # /api/swagger ->  /swagger
    location /api/ {
        proxy_pass http://api;   # UWAGA: host 'api' + SLASH na końcu
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
