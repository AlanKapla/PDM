name: Build & deploy pdm-webapi

run-name: "Deploy pdm-webapi → ${{ github.event.inputs.environment }} → branch ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev/ppd/prd)'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - ppd
          - prd

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: self-hosted

    # GitHub Environment: dev / ppd / prd
    environment: ${{ github.event.inputs.environment }}

    env:
      # Nazwa środowiska do docker compose / labeli
      ENVIRONMENT_NAME: ${{ github.event.inputs.environment }}
      # Port hosta – z GitHub Environment → Variables
      HOST_PORT: ${{ vars.HOST_PORT }}
      # URL środowiska – z GitHub Environment → Variables
      ENVIRONMENT_URL: ${{ vars.ENVIRONMENT_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create .env for docker-compose
        shell: pwsh
        working-directory: 03-Deployment
        run: |
          $envName = $env:ENVIRONMENT_NAME
          $hostPort = $env:HOST_PORT

          @"
          ENVIRONMENT=$envName
          HOST_PORT=$hostPort
          AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}
          CONNECTIONSTRINGS__DEFAULTCONNECTION=${{ secrets.CONNECTIONSTRINGS__DEFAULTCONNECTION }}
          "@ | Set-Content -Path .env -Encoding UTF8

      - name: Build & start containers (docker compose)
        shell: pwsh
        working-directory: 03-Deployment
        run: |
          $envName = $env:ENVIRONMENT_NAME
          docker compose -p "pdm-$envName" -f docker-compose.yml up -d --build

      - name: Health check http://localhost:{port}/health
        shell: pwsh
        run: |
          $envName = $env:ENVIRONMENT_NAME
          $port    = $env:HOST_PORT
          $url = "http://localhost:$port/health"
          $maxRetries = 10
          $delay = 5
          $ok = $false

          Write-Host "Environment: $envName"
          Write-Host "Health URL: $url"

          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "[$envName] Health check attempt $i/$maxRetries on $url..."
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                Write-Host "Health check OK: $($response.StatusCode)"
                $ok = $true
                break
              }
            }
            catch {
              Write-Host "Health check failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds $delay
          }

          if (-not $ok) {
            Write-Host "Health check FAILED after $maxRetries attempts. Showing logs..."
            docker compose -p "pdm-$envName" -f 03-Deployment/docker-compose.yml logs webapi || $true
            throw "Deployment failed – service unhealthy."
          }

      # 🔽🔽🔽 NOWE: GitHub Deployments 🔽🔽🔽

      - name: Create GitHub deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const envName = process.env.ENVIRONMENT_NAME;

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: envName,
              auto_merge: false,
              required_contexts: [], // bez wymaganych checków
              description: `Deploy pdm-webapi to ${envName} from ${context.ref}`
            });

            core.setOutput('deployment_id', deployment.data.id);

      - name: Set deployment status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const envName = process.env.ENVIRONMENT_NAME;
            const envUrl  = process.env.ENVIRONMENT_URL || undefined;
            const deploymentId = ${{ steps.create_deployment.outputs.deployment_id }};
            const actor = process.env.GITHUB_ACTOR;

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment: envName,
              environment_url: envUrl,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Deployment to ${envName} succeeded from ${context.ref} by ${actor}`
            });
