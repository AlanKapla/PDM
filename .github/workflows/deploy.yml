name: Build & deploy pdm-webapi

run-name: "Deploy pdm-webapi → ${{ github.event.inputs.environment }} → branch ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev/ppd/prd)'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - ppd
          - prd
      runner:
        description: 'Self-hosted runner label'
        required: true
        type: choice
        options:
          - pdm1

permissions:
  contents: read

jobs:
  deploy:
    runs-on:
      - self-hosted
      - ${{ github.event.inputs.runner }}

    # GitHub Environment: dev / ppd / prd + link do aplikacji
    environment:
      name: ${{ github.event.inputs.environment }}
      url: ${{ vars.ENVIRONMENT_URL }}

    env:
      # Nazwa środowiska do docker compose / labeli
      ENVIRONMENT_NAME: ${{ github.event.inputs.environment }}
      # Port hosta – z GitHub Environment → Variables (HOST_PORT)
      HOST_PORT: ${{ vars.HOST_PORT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create .env for docker-compose
        shell: pwsh
        working-directory: 03-Deployment
        run: |
          $envName = $env:ENVIRONMENT_NAME
          $hostPort = $env:HOST_PORT

          @"
          ENVIRONMENT=$envName
          HOST_PORT=$hostPort
          AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}
          CONNECTIONSTRINGS__DEFAULTCONNECTION=${{ secrets.CONNECTIONSTRINGS__DEFAULTCONNECTION }}
          "@ | Set-Content -Path .env -Encoding UTF8

      - name: Build & start containers (docker compose)
        shell: pwsh
        working-directory: 03-Deployment
        run: |
          $envName = $env:ENVIRONMENT_NAME

          Write-Host "Stopping existing stack (if any) for pdm-$envName..."
          docker compose -p "pdm-$envName" -f docker-compose.yml down || $true

          Write-Host "Starting stack pdm-$envName..."
          docker compose -p "pdm-$envName" -f docker-compose.yml up -d --build

      - name: Health check WebAPI (inside container)
        shell: pwsh
        run: |
          $envName = $env:ENVIRONMENT_NAME
          $containerName = "pdm-webapi-$envName"

          $maxRetries = 10
          $delay = 5
          $ok = $false

          Write-Host "Checking internal health inside WebAPI container: $containerName"

          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "[$envName] Internal health attempt $i/$maxRetries in container $containerName..."

            docker exec $containerName curl -sf http://localhost:8080/api/health

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Internal WebAPI health OK."
              $ok = $true
              break
            }

            Write-Host "Internal health check failed (exit code $LASTEXITCODE). Retrying in $delay seconds..."
            Start-Sleep -Seconds $delay
          }

          if (-not $ok) {
            Write-Host "Internal WebAPI health FAILED after $maxRetries attempts. Showing logs..."
            docker logs $containerName | Select-Object -Last 200 || $true
            exit 1
          }

          exit 0

      - name: Health check via NGINX reverse proxy
        shell: pwsh
        working-directory: 03-Deployment
        run: |
          $envName = $env:ENVIRONMENT_NAME
          $port    = $env:HOST_PORT
          $url     = "http://localhost:$port/api/health"
          $maxRetries = 10
          $delay      = 5
          $ok         = $false

          Write-Host "Environment: $envName"
          Write-Host "Health URL (via nginx): $url"

          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "[$envName] Health check attempt $i/$maxRetries on $url..."
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                Write-Host "Health check OK: $($response.StatusCode)"
                $ok = $true
                break
              } else {
                Write-Host "Health check returned non-2xx: $($response.StatusCode)"
              }
            }
            catch {
              Write-Host "Health check failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds $delay
          }

          if (-not $ok) {
            Write-Host "Health check FAILED after $maxRetries attempts. Showing webapi logs..."
            docker compose -p "pdm-$envName" -f docker-compose.yml logs webapi || $true
            throw "Deployment failed – service unhealthy (via nginx)."
          }

          Write-Host "External health via nginx OK."
