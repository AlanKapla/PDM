name: Deploy to Azure

run-name: "Deploy PDM → ${{ github.event.inputs.environment }} → ${{ github.ref_name }} → ${{ github.event.head_commit.message || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Azure environment'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    environment:
      name: azure-${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.1

      - name: Restore solution
        working-directory: 02-ApplicationServices/ProductDataManagementWebAPI
        run: dotnet restore

      - name: Generate idempotent SQL script
        working-directory: 02-ApplicationServices/ProductDataManagementWebAPI/src/Entities
        env:
          ConnectionStrings__DefaultConnection: "Server=placeholder;Database=placeholder;"
        run: |
          dotnet ef migrations script \
            --idempotent \
            --output ${{ github.workspace }}/migration.sql \
            --startup-project ../WebApi \
            --project .
          echo "=== Generated migration script ==="
          head -50 ${{ github.workspace }}/migration.sql
          echo "..."
          wc -l ${{ github.workspace }}/migration.sql

      - name: Upload migration script as artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-sql-${{ github.event.inputs.environment }}
          path: ${{ github.workspace }}/migration.sql
          retention-days: 30

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure AD access token for SQL
        id: get-token
        shell: bash
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://database.windows.net/ \
            --query accessToken \
            --output tsv)
          echo "::add-mask::$TOKEN"
          echo "sql-token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Execute migration on Azure SQL
        shell: pwsh
        run: |
          $serverName = "${{ vars.AZURE_SQL_SERVER }}"
          $databaseName = "${{ vars.AZURE_SQL_DATABASE }}"
          $scriptPath = "${{ github.workspace }}/migration.sql"
          $token = "${{ steps.get-token.outputs.sql-token }}"

          Write-Host "🗄️ Running migration on: $serverName / $databaseName"

          $connectionString = "Server=tcp:${serverName},1433;Initial Catalog=${databaseName};Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;"

          $connection = New-Object System.Data.SqlClient.SqlConnection($connectionString)
          $connection.AccessToken = $token

          try {
            $connection.Open()
            Write-Host "✅ Connected to database"

            $sqlScript = Get-Content $scriptPath -Raw

            # Podział skryptu na partie po instrukcji GO
            $batches = $sqlScript -split '(?m)^\s*GO\s*$' | Where-Object { $_.Trim() -ne '' }
            Write-Host "📦 Found $($batches.Count) SQL batches to execute"

            $batchNum = 0
            foreach ($batch in $batches) {
              $batchNum++
              $command = $connection.CreateCommand()
              $command.CommandText = $batch
              $command.CommandTimeout = 120
              $command.ExecuteNonQuery() | Out-Null
            }

            Write-Host "✅ Migration completed successfully ($batchNum batches executed)"
          }
          catch {
            Write-Host "❌ Migration FAILED: $($_.Exception.Message)"
            exit 1
          }
          finally {
            $connection.Close()
          }

  build-and-deploy-api:
    runs-on: ubuntu-latest
    needs: migrate-database
    environment:
      name: azure-${{ github.event.inputs.environment }}
      url: ${{ vars.API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: 02-ApplicationServices/ProductDataManagementWebAPI/src/WebApi
        run: dotnet restore --runtime win-x64

      - name: Build WebAPI
        working-directory: 02-ApplicationServices/ProductDataManagementWebAPI/src/WebApi
        run: dotnet build --configuration Release --no-restore

      - name: Publish WebAPI
        working-directory: 02-ApplicationServices/ProductDataManagementWebAPI/src/WebApi
        run: |
          dotnet publish --configuration Release --no-build --output ${{ github.workspace }}/api-publish
          echo "=== Published files ==="
          ls -la ${{ github.workspace }}/api-publish
          echo "=== Checking for DLL ==="
          ls -la ${{ github.workspace }}/api-publish/*.dll || echo "No DLL files found"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/api-publish

      - name: Wait for App Service to restart
        shell: pwsh
        run: |
          Write-Host "⏳ Waiting 30 seconds for App Service to restart and initialize..."
          Start-Sleep -Seconds 30

      - name: Health check API
        shell: pwsh
        run: |
          $apiUrl = "${{ vars.API_URL }}/api/health"
          $maxRetries = 20
          $delay = 30
          $ok = $false

          Write-Host "Checking API health at: $apiUrl"

          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Health check attempt $i/$maxRetries..."
            try {
              $response = Invoke-WebRequest -Uri $apiUrl -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                Write-Host "✅ API health check OK: $($response.StatusCode)"
                $ok = $true
                break
              }
            }
            catch {
              Write-Host "⚠️ Health check failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds $delay
          }

          if (-not $ok) {
            Write-Host "❌ API health check FAILED after $maxRetries attempts"
            exit 1
          }

  build-and-deploy-ui:
    runs-on: ubuntu-latest
    needs: build-and-deploy-api
    environment:
      name: azure-${{ github.event.inputs.environment }}
      url: ${{ vars.FRONTEND_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 01-Applications/ProjectDataManagementUI/package-lock.json

      - name: Install dependencies
        working-directory: 01-Applications/ProjectDataManagementUI
        run: npm ci

      - name: Create production .env file
        working-directory: 01-Applications/ProjectDataManagementUI
        run: |
          echo "VITE_API_BASE_URL=${{ vars.API_URL }}" > .env.production

      - name: Build UI
        working-directory: 01-Applications/ProjectDataManagementUI
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '01-Applications/ProjectDataManagementUI/dist'
          output_location: ''
          skip_app_build: true

      - name: Health check UI
        shell: pwsh
        run: |
          $uiUrl = "${{ vars.FRONTEND_BASE_URL }}"
          $maxRetries = 10
          $delay = 10
          $ok = $false

          Write-Host "Checking UI at: $uiUrl"

          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "UI check attempt $i/$maxRetries..."
            try {
              $response = Invoke-WebRequest -Uri $uiUrl -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                Write-Host "✅ UI check OK: $($response.StatusCode)"
                $ok = $true
                break
              }
            }
            catch {
              Write-Host "⚠️ UI check failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds $delay
          }

          if (-not $ok) {
            Write-Host "❌ UI check FAILED after $maxRetries attempts"
            exit 1
          }

  verify-deployment:
    runs-on: ubuntu-latest
    needs: [migrate-database, build-and-deploy-api, build-and-deploy-ui]
    environment:
      name: azure-${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify full stack
        shell: pwsh
        run: |
          $commitSha = "${{ github.sha }}"
          $commitShort = $commitSha.Substring(0, 7)
          $commitMessage = git log -1 --format='%s' $commitSha
          $commitAuthor = git log -1 --format='%an' $commitSha
          $commitDate = git log -1 --format='%ai' $commitSha
          $branch = "${{ github.ref_name }}"

          Write-Host "🎉 Deployment completed successfully!"
          Write-Host ""
          Write-Host "📋 Commit info:"
          Write-Host "   SHA:     $commitShort"
          Write-Host "   Message: $commitMessage"
          Write-Host "   Author:  $commitAuthor"
          Write-Host "   Date:    $commitDate"
          Write-Host "   Branch:  $branch"
          Write-Host ""
          Write-Host "🌐 URLs:"
          Write-Host "   API: ${{ vars.API_URL }}"
          Write-Host "   UI:  ${{ vars.FRONTEND_BASE_URL }}"
          Write-Host "   Env: azure-${{ github.event.inputs.environment }}"
